name: Build Goat Simulator 3DS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Find specs files
        run: |
          find / -iname "*3dsx*" 2>/dev/null
          echo "---"
          find / -iname "*_specs*" 2>/dev/null
          echo "---"
          $DEVKITARM/bin/arm-none-eabi-gcc -print-search-dirs

      - name: Build .cia
        run: |
          export PATH="$DEVKITARM/bin:$PATH"
          make cia

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: goat3ds-cia
          path: goat3ds.cia
          if-no-files-found: error
